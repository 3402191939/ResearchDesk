services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: researchdesk
      POSTGRES_PASSWORD: researchdesk_local
      POSTGRES_DB: researchdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchdesk -d researchdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: